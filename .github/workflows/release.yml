name: Release de l'installeur

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire l'installeur Windows
        run: python scripts/build_installer.py
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_TEMPLATE.md
          files: |
            dist/Installeur-TV-Launcher.zip
            dist/SHA256SUMS.txt
